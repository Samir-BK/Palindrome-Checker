<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1><b>Is it a Palindrome?</b></h1>
    <div class = "text-container">
        <label for="text-input">Enter text to check for a palindrome:</label>
        <input type = "text" id ="text-input" placeholder="Type here..." size="50">  
        <button id="check-btn">Check</button>
        <div id="result"></div>
    </div>
    <div class="info-container">
        <h3>What is a Palindrome?</h3>
        <p>💡 A <i>palindrome </i>is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.</p>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
